      - orgId: 1
        name: Discord
        receivers:
        - uid: cfw98x5y7241sc
          type: discord
          settings:
            url: https://discord.com/api/webhooks/1529645781416673334/ACP-wMo5ZwS64B3aOBqNa7fMsL-PGlq6ZjD4AKVek6f2KdXS0VhjOXqxT5c61q7am7Qt
            use_discord_username: false
            use_embed_description: false
          disableResolveMessage: false
    rules.yaml:
      apiVersion: 1
      groups:
      - orgId: 1
        name: alertas
        folder: Alertas
        interval: 1m
        rules:
        - uid: efw9996oatfy8b
          title: CPU acima de 80% do limite
          condition: C
          data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: "(\r\n  sum by (namespace) (\r\n    rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m])\r\n  )\r\n/\r\n  sum by (namespace) (\r\n    kube_pod_container_resource_limits{resource=\"cpu\"}\r\n  )\r\n) * 100"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
              - evaluator:
                  params:
                  - 80
                  type: gt
                operator:
                  type: and
                query:
                  params:
                  - C
                reducer:
                  params: []
                  type: last
                type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: 'O namespace {{ "{{" }} $labels.namespace {{ "}}" }} está consumindo {{ "{{" }} printf "%.2f" $values.A.Value {{ "}}" }}% da CPU configurada como limite.'
            summary: 'Alto consumo de CPU no namespace {{ "{{" }} $labels.namespace {{ "}}" }}'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: cfw99gtujmupse
          title: Memória acima de 85% do limite
          condition: C
          data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: "(\r\n  sum by (namespace) (\r\n    container_memory_working_set_bytes\r\n  )\r\n/\r\n  sum by (namespace) (\r\n    kube_pod_container_resource_limits{resource=\"memory\"}\r\n  )\r\n) * 100\r\n"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
              - evaluator:
                  params:
                  - 85
                  type: gt
                operator:
                  type: and
                query:
                  params:
                  - C
                reducer:
                  params: []
                  type: last
                type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: 'O namespace {{ "{{" }} $labels.namespace {{ "}}" }} está consumindo {{ "{{" }} printf "%.2f" $values.A.Value {{ "}}" }}% da memória disponível.'
            summary: 'Memória alta no namespace {{ "{{" }} $labels.namespace {{ "}}" }}'
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: dfw99j1njuk1sd
          title: Containers reiniciando
          condition: C
          data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: "sum by (namespace) (\r\n  increase(kube_pod_container_status_restarts_total[15m])\r\n)"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
              - evaluator:
                  params:
                  - 3
                  type: gt
                operator:
                  type: and
                query:
                  params:
                  - C
                reducer:
                  params: []
                  type: last
                type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: 'Foram detectadas {{ "{{" }} printf "%.0f" $values.A.Value {{ "}}" }} reinicializações nos últimos 15 minutos no namespace {{ "{{" }} $labels.namespace {{ "}}" }}.'
            summary: 'Containers reiniciando no namespace {{ "{{" }} $labels.namespace {{ "}}" }}'
          isPaused: false
          notification_settings:
            receiver: Discord
