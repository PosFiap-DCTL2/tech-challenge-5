  additionalDataSources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki-gateway.loki.svc.cluster.local
    isDefault: false
    jsonData:
      maxLines: 1000
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger-query.jaeger.svc.cluster.local:16686
    isDefault: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    additionalArgs:
    - name: web.enable-remote-write-receiver
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
alertmanager:
  alertmanagerSpec: {}