# Alloy roda como DaemonSet -> uma instância por nó
controller:
  type: daemonset
  tolerations:
    - operator: "Exists"

rbac:
  create: true

serviceAccount:
  create: true

alloy:
  # otelcol.exporter.datadog é COMMUNITY COMPONENT.
  # Sem essa flag o Alloy falha ao carregar o config.
  extraArgs:
    - --feature.community-components.enabled
    - --stability.level=experimental

  # DD_API_KEY: Secret datadog-api-key (namespace alloy)
  # NODE_NAME: nó onde o pod roda (cada pod coleta só o seu nó)
  extraEnv:
    - name: DD_API_KEY
      valueFrom:
        secretKeyRef:
          name: datadog-api-key
          key: api-key
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  # Portas OTLP para receber traces das aplicações
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: "TCP"
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: "TCP"
    - name: datadog-traces
      port: 8126
      targetPort: 8126
      protocol: "TCP"

  configMap:
    create: true
    content: |-
      // =======================================================================
      // LOGS -> LOKI
      // =======================================================================

      // Descobre apenas os pods do nó onde este Alloy está rodando
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_controller_name"]
          target_label  = "app"
        }
      }

      // Lê os logs via API do Kubernetes e envia ao Loki
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        }
      }


      // =======================================================================
      // METRICAS -> PROMETHEUS
      // =======================================================================

      discovery.kubernetes "nodes" {
        role = "node"

        selectors {
          role  = "node"
          field = "metadata.name=" + sys.env("NODE_NAME")
        }
      }

      // kubelet
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }

        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics"
        }
      }

      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        forward_to = [prometheus.remote_write.default.receiver]

        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          insecure_skip_verify = true
        }
      }

      // cAdvisor (métricas de containers)
      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__scheme__"
          replacement  = "https"
        }

        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
      }

      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        forward_to = [prometheus.remote_write.default.receiver]

        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          insecure_skip_verify = true
        }
      }

      // Pods com annotation prometheus.io/scrape=true (nó local)
      discovery.relabel "annotated_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          action        = "replace"
          target_label  = "__metrics_path__"
          regex         = "(.+)"
        }

        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "annotated_pods" {
        targets    = discovery.relabel.annotated_pods.output
        forward_to = [prometheus.remote_write.default.receiver]
      }

      // Prometheus precisa de --web.enable-remote-write-receiver habilitado
      prometheus.remote_write "default" {
        endpoint {
          url = "http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090/api/v1/write"
        }
      }


      // =======================================================================
      // TRACES (APM) -> DATADOG via OTLP
      //
      // Fluxo: receiver.otlp -> processor.batch -> exporter.datadog
      // =======================================================================

      // Recebe traces nativos do dd-trace-go na porta 8126
      otelcol.receiver.datadog "default" {
        endpoint = "0.0.0.0:8126"

        trace_id_cache {
          size = 1000
        }

        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        timeout = "10s"

        output {
          traces = [otelcol.exporter.datadog.default.input]
        }
      }

      // Site us5 -> datadoghq.com
      otelcol.exporter.datadog "default" {
        api {
          api_key = sys.env("DD_API_KEY")
          site    = "datadoghq.com"
        }

        // Sem Datadog Agent, evita registrar o pod como "host"
        host_metadata {
          enabled = false
        }
      }

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi