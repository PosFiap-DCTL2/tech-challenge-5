name: NGO Service CI

on:
  push:
    branches: [ "main"]
    paths:
      - 'app/ngo-service/**'
  pull_request:
    branches: [ "main"]
    paths:
      - 'app/ngo-service/**'
  workflow_dispatch:

jobs:
  # 1. Pipeline de Segurança (Reutilizável)
  security-checks:
    name: Reusable Security
    uses: ./.github/workflows/security.yaml
    with:
      service_path: './app/ngo-service'
      language: 'python'

  # 2. Pipeline de Build e Validação
  build:
    name: Build and Check
    runs-on: ubuntu-latest
    needs: security-checks # Só faz o build se a segurança passar
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f app/ngo-service/requirements.txt ]; then pip install -r app/ngo-service/requirements.txt; fi

      - name: Lint with flake8
        # Checa erros fatais de sintaxe no código python
        run: |
          flake8 app/ngo-service --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test Docker Build
        # Constrói o container de forma isolada para garantir que o Dockerfile está funcional
        run: docker build -t ngo-service:test ./app/ngo-service

  # 3. Pipeline de Deploy
  deploy:
    needs: build
    uses: ./.github/workflows/aws-deploy.yaml
    with:
      service_name: 'ngo-service'
    secrets: inherit # Importante: permite que o workflow reutilizável acesse as secrets do repositório