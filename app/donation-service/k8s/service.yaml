apiVersion: v1
kind: Service
metadata:
  name: donation-service
  labels:
    app: donation-service
    tier: api
    project: SolidaryTech
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: donation-service
