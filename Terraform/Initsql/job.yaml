apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: default
spec:
  ttlSecondsAfterFinished: 120   # auto-deleta após 2 min
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: postgres:15-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo ">>> donationdb" && \
              PGPASSWORD=\$DONATION_PASS psql -h \$DONATION_HOST -p 5432 -U \$DB_USER -d donationdb -f /scripts/donationdb.sql && \
              echo ">>> ngodb" && \
              PGPASSWORD=\$NGO_PASS psql -h \$NGO_HOST -p 5432 -U \$DB_USER -d ngodb -f /scripts/ngodb.sql && \
            - name: DONATION_HOST
              value: "$DONATION_HOST"
            - name: NGO_HOST
              value: "$NGO_HOST"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: db_user
            - name: DONATION_PASS
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: auth_db_password
            - name: NGO_PASS
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: ngo_db_password
          volumeMounts:
            - name: sql-scripts
              mountPath: /scripts
      volumes:
        - name: sql-scripts
          configMap:
            name: init-sql-scripts
